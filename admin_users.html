<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Просмотр аккаунтов</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Roboto', sans-serif;
  background: #0d0d11;
  color: #00ccff;
  text-align: center;
  padding: 20px;
}
h1 { margin-bottom: 30px; }
table {
  width: 100%;
  border-collapse: collapse;
  margin: 0 auto;
  max-width: 1000px;
}
th, td {
  border: 1px solid #0077ff;
  padding: 10px;
  text-align: center;
}
th {
  background: #001d33;
}
img.avatar {
  width: 50px;
  height: 50px;
  object-fit: cover;
  border-radius: 50%;
}
.back-btn {
  display: inline-block;
  color: #00ccff;
  text-decoration: none;
  font-weight: bold;
  margin-bottom: 20px;
  font-size: 1.1em;
}
.back-btn:hover { color: #fff; }
</style>
</head>
<body>
<a href="main.html" class="back-btn">← На главную</a>
<h1>Все аккаунты</h1>
<table id="users-table">
  <thead>
    <tr>
      <th>Аватар</th>
      <th>Ник</th>
      <th>Email</th>
      <th>О себе</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script type="module">
import { supabase } from './accounts.js';

const tbody = document.querySelector('#users-table tbody');

async function loadUsers() {
  tbody.innerHTML = '<tr><td colspan="4">Загрузка...</td></tr>';
  try {
    const { data: users, error } = await supabase.from('users').select('*');
    if (error) throw error;

    if (!users || users.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4">Аккаунтов нет</td></tr>';
      return;
    }

    tbody.innerHTML = '';
    users.forEach(u => {
      const tr = document.createElement('tr');

      const avatarTd = document.createElement('td');
      const img = document.createElement('img');
      img.className = 'avatar';
      img.src = u.photo || 'images/avatarka01.jpg';
      avatarTd.appendChild(img);
      tr.appendChild(avatarTd);

      const nicknameTd = document.createElement('td');
      nicknameTd.textContent = u.nickname || '(без ника)';
      tr.appendChild(nicknameTd);

      const emailTd = document.createElement('td');
      emailTd.textContent = u.email || '';
      tr.appendChild(emailTd);

      const aboutTd = document.createElement('td');
      aboutTd.textContent = u.about || '';
      tr.appendChild(aboutTd);

      tbody.appendChild(tr);
    });
  } catch (err) {
    console.error('Error loading users:', err);
    tbody.innerHTML = `<tr><td colspan="4" style="color:#ff5555">Ошибка загрузки: ${err.message}</td></tr>`;
  }
}

loadUsers();
</script>
</body>
</html>
