<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ㅤ</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: #000;
        overflow: hidden;
        font-family: "Courier New", monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        animation: bgPulse 4s infinite ease-in-out;
    }

    @keyframes bgPulse {
        0%,100% { filter: brightness(0.85); }
        50% { filter: brightness(0.95); }
    }

    #crt {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        transform: perspective(800px) scale(1.03);
        filter: contrast(1.25) brightness(1.05);
        overflow: hidden;
        animation: crtFloat 6s infinite ease-in-out;
    }

    @keyframes crtFloat {
        0%,100% { transform: perspective(800px) scale(1.03) translateY(0); }
        50% { transform: perspective(800px) scale(1.03) translateY(2px); }
    }

    /* Скан-линии */
    #crt::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.02) 0px,
            rgba(255,255,255,0.02) 1px,
            rgba(0,0,0,0) 2px,
            rgba(0,0,0,0) 4px
        );
        animation: scanline 12s linear infinite;
        pointer-events: none;
    }

    @keyframes scanline {
        0% { transform: translateY(0); }
        100% { transform: translateY(4px); }
    }

    /* Лёгкое мерцание */
    #crt::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255,255,255,0.015);
        mix-blend-mode: overlay;
        animation: flicker 0.25s infinite;
        pointer-events: none;
    }

    @keyframes flicker {
        0% { opacity: 0.01; }
        50% { opacity: 0.05; }
        100% { opacity: 0.01; }
    }

    /* Помехи по краям */
    .edges {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            radial-gradient(circle at left, rgba(255,255,255,0.05), transparent 60%),
            radial-gradient(circle at right, rgba(255,255,255,0.05), transparent 60%);
        mix-blend-mode: screen;
        opacity: 0.2;
    }

    #text {
        position: relative;
        color: #fff;
        font-size: 40px;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
        z-index: 3;
        transform-origin: center;
    }

    .letter {
        display: inline-block;
        animation: shakeLetter 120ms infinite;
    }

    @keyframes shakeLetter {
        0% { transform: translate(0,0); }
        25% { transform: translate(-1px,1px); }
        50% { transform: translate(1px,-1px); }
        75% { transform: translate(-1px,-1px); }
        100% { transform: translate(0,0); }
    }

    .glitch {
        animation: glitchFlash 0.12s;
    }

    @keyframes glitchFlash {
        0% { opacity: 0.3; transform: skewX(10deg); }
        100% { opacity: 1; transform: skewX(0deg); }
    }

    .noise {
        pointer-events: none;
        position: fixed;
        inset: 0;
        z-index: 4;
        background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIW2P4//8/AwAI/AL+ShBrWAAAAABJRU5ErkJggg==');
        opacity: 0.09;
        mix-blend-mode: overlay;
    }
</style>
</head>
<body>

<div id="crt">
    <div class="edges"></div>
    <div id="text"></div>
</div>
<div class="noise"></div>

<script>
let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let whiteNoiseGain = null;
let whiteNoiseSource = null;

// Белый шум (фон)
function playWhiteNoise() {
    let bufferSize = 2 * audioCtx.sampleRate;
    let noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    let output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
    let source = audioCtx.createBufferSource();
    source.buffer = noiseBuffer;
    source.loop = true;
    let gainNode = audioCtx.createGain();
    gainNode.gain.value = 0.015; // стартовая громкость
    source.connect(gainNode).connect(audioCtx.destination);
    source.start();
    whiteNoiseGain = gainNode;
    whiteNoiseSource = source;
}

// звук печатания
function clickSound(freqOffset = 0) {
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.value = 120 + freqOffset + Math.random()*50;
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
}

const messages = [
    "АЛО МУДОФИЛ",
    "ТАК ДЕЛА НЕ ДЕЛАЮТСЯ",
    "ВЕРНИСЬ ОБРАТНО",
    "ГАДЁНЫШ Я ТЕБЯ УРОЮ ВЕДЬ"
];

let clickIndex = 0;
const textEl = document.getElementById("text");
const redirectUrl = "https://zverskinapalen.neocities.org/lol";
let shakeStrength = 1;
let scaleSize = 1;

function typeText(str) {
    textEl.innerHTML = "";
    let i = 0;
    function type() {
        if(i < str.length){
            const span = document.createElement("span");
            span.textContent = str[i];
            span.classList.add("letter");
            span.style.animation = `shakeLetter 120ms infinite`;
            textEl.appendChild(span);
            clickSound(shakeStrength*10);
            i++;
            setTimeout(type, 40+Math.random()*50);
        }
    }
    type();
}

typeText("ТЕБЕ СЮДА НЕЛЬЗЯ");
playWhiteNoise();

textEl.addEventListener("click", () => {
    shakeStrength += 5; // увеличиваем силу тряски
    scaleSize += 0.07; // увеличиваем размер текста
    textEl.style.transform = `scale(${scaleSize})`;

    // Увеличиваем громкость белого шума с каждым кликом
    if (whiteNoiseGain) {
        whiteNoiseGain.gain.value = Math.min(0.3, whiteNoiseGain.gain.value + 0.0015);
    }

    if (clickIndex < messages.length){
        typeText(messages[clickIndex]);
        clickIndex++;
        return;
    }

    // 5-й клик → экран резко черный, отключаем шум
    if(whiteNoiseGain) whiteNoiseGain.gain.setValueAtTime(0, audioCtx.currentTime);
    textEl.style.display = "none";
    document.getElementById("crt").style.background = "#000";

    setTimeout(() => {
        window.location.href = redirectUrl;
    }, 5000); // через 5 секунд
});
</script>

</body>
</html>
