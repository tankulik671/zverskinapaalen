<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Дискография</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>

/* === Базовая вёрстка — как было, с нужными изменениями === */
html,body{height:100%;margin:0;padding:0}
body{
  font-family:'Roboto',system-ui,Arial,sans-serif;
  color:#cfefff;background:#001022;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-size:16px; /* базовый размер */
}
.page-bg{position:fixed;inset:0;background:url("images/НЕБО ФОН.gif")center/cover no-repeat;z-index:-3;filter:brightness(.45)contrast(1.1);animation:bgScroll 60s linear infinite}
@keyframes bgScroll{0%{background-position:0 0}50%{background-position:100% 100%}100%{background-position:0 0}}
.overlay-dim{position:fixed;inset:0;background:rgba(0,0,20,.25);z-index:-2}
.topbar{max-width:1180px;margin:18px auto 0;display:flex;align-items:center;gap:18px;padding:0 34px;box-sizing:border-box}
.topbar .logo{width:88px;height:auto;display:block}
.title-image{display:block;height:120px;object-fit:contain;margin-left:8px;user-select:none}
.container{max-width:1180px;margin:40px auto;background:#222427;border:3px solid rgba(0,140,210,.12);box-shadow:0 6px 30px rgba(0,50,100,.6),0 0 40px rgba(0,140,255,.06) inset;color:#d7eefc;padding:28px 34px;box-sizing:border-box}

/* секции */
.section{margin-top:22px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-title{font-size:28px;color:#bfeaff;font-weight:700;text-shadow:0 0 8px rgba(0,160,255,.18)}
.show-all{color:#82d6ff;font-weight:700;font-size:14px;cursor:pointer}
.show-all:hover{text-decoration:underline}

/* карусель — на десктоп стрелками, на мобилке — touch/swipe */
.carousel{position:relative;overflow:hidden;padding:6px 0}
.carousel-track{
  display:flex;gap:20px;
  overflow-x:auto;
  scroll-behavior:smooth;
  padding:10px 6px;
  will-change:transform;
}
.carousel-track::-webkit-scrollbar{height:8px;display:none}

/* карточки (УВЕЛИЧЕНЫ: обложки и названия) */
.card{min-width:200px;width:200px;flex:0 0 auto;text-align:left;color:#cfeeff;user-select:none;transition:transform .15s ease}
.cover{width:100%;height:200px;background:#0b0b0b;overflow:hidden;position:relative;border-radius:6px;transition:transform .18s ease,filter .12s linear,box-shadow .12s}
.cover img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.cover-hover{filter:brightness(1.5) saturate(1.3);box-shadow:0 10px 40px rgba(0,170,255,0.16)}
.meta-title{margin-top:10px;font-weight:700;font-size:16px;color:#e8fbff}
.meta-sub{font-size:13px;color:#9fb7c7;margin-top:6px}

/* стрелочки (внешние) */
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;background:rgba(0,0,0,.45);color:#cfefff;border:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;border-radius:6px;z-index:5;transition:background .12s, transform .12s}
.arrow:hover{background:rgba(0,160,255,.45);transform:translateY(-50%) scale(1.04)}
.arrow.left{left:6px}
.arrow.right{right:6px}

/* секция альбомов */
.albums-grid{display:flex;gap:18px;margin-top:6px;flex-wrap:wrap}
.album-card{width:220px;text-align:left}
.album-cover{width:100%;height:240px;background:#111;object-fit:cover;transition:filter .2s, transform .2s;border-radius:6px;display:block}

/* 404-модал (высокий z-index) — простой */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:11000;padding:20px;box-sizing:border-box}
.modal{width:min(560px,94%);background:#0f1112;border:2px solid rgba(0,140,210,.12);padding:20px;box-sizing:border-box;color:#cfefff;text-align:center;position:relative}
.modal .close{position:absolute;right:10px;top:8px;background:transparent;border:0;color:#9ff;font-size:18px;cursor:pointer}

/* "Показать все" модал (нижний слой) — показываем обложки в сетке, с прокруткой */
.modal-overlay-all{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:10000;padding:20px;box-sizing:border-box}
.modal-all{width:min(1000px,96%);background:#0f1112;border:2px solid rgba(0,140,210,.12);padding:18px;box-sizing:border-box;color:#cfefff;max-height:78vh;overflow-y:auto;
overflow-x:hidden;
}
.modal-all .close{float:right;background:none;border:0;color:#9ff;font-size:18px;cursor:pointer}
.modal-all-content{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:8px}

/* Плавающее окно (СТИЛИ УЛУЧШЕНЫ: шрифты/размеры/вкладки) */
.floating-window{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:600px;min-width:320px;min-height:220px;
  background:#0b0d0e;border:2px solid rgba(0,160,255,.14);box-shadow:0 10px 40px rgba(0,0,0,.5);z-index:13000;
  display:none;box-sizing:border-box;padding:12px;cursor:default;
}
.floating-window .titlebar{
  height:36px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px;margin:-4px -4px 8px -4px;background:rgba(0,0,0,0.04);
  border-bottom:1px solid rgba(255,255,255,0.02);cursor:grab;
}
/* УБИРАЕМ ТЕКСТ В ЗАГОЛОВКЕ (по просьбе) — оставляем кнопку закрытия */
.floating-window .titlebar .label{display:none}

/* контент всплывашки — увеличенные шрифты, похожие на пример */
/* УБРАЛ overflow у .content чтобы не было двойной прокрутки — только fw-tab-content будет скролтиться */
.floating-window .content{padding:8px;overflow:visible;max-height:none;color:#dfefff;font-size:16px}
.fw-cover{width:264px;height:264px;border-radius:6px;object-fit:cover;display:block} /* 2x (было 132) */
.fw-title{font-weight:700;font-size:26px;color:#bfeaff;margin-top:6px} /* чуть больше */
.fw-meta{font-size:15px;color:#9fc;margin-top:6px}
.fw-listen{margin:12px 0}
.fw-tabs{display:flex;gap:10px;margin-bottom:10px}
.fw-tabs button{flex:1;padding:8px 10px;border-radius:6px;border:0;font-weight:700;cursor:pointer}
.fw-tab-active{background:#0b3c59;color:#bfeaff}
.fw-tab-inactive{background:#062030;color:#9fc}

/* контент текста в окне — ОСТАВЛЯЕМ ТОЛЬКО ЭТУ ПРОКРУТКУ */
.fw-tab-content{white-space:pre-wrap;line-height:1.6;color:#dfefff;text-align:left;max-height:46vh;overflow-y:auto;border-top:1px solid rgba(255,255,255,.03);padding-top:8px;font-size:17px}

/* Album modal (two-column) */
.album-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:14000;padding:20px;box-sizing:border-box}
.album-modal{width:min(980px,96%);background:#071017;border:2px solid rgba(0,140,210,.12);padding:18px;box-sizing:border-box;color:#dff;font-size:15px;display:flex;gap:18px;max-height:82vh;overflow:hidden;border-radius:8px}
.album-left{flex:0 0 320px}
.album-left .cover{height:320px}
.album-right{flex:1;display:flex;flex-direction:column;overflow:auto}
.album-right .album-header{display:flex;align-items:center;gap:12px;justify-content:space-between}
.album-right .album-desc{margin-top:8px;color:#dfefff;line-height:1.5;padding-right:6px}
.album-right .tracklist{margin-top:12px;list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.album-right .tracklist li{padding:8px;border-radius:6px;background:rgba(255,255,255,0.02);cursor:pointer}
.album-right .tracklist li:hover{background:rgba(0,160,255,0.06);transform:translateX(4px)}
.album-modal .close{position:absolute;right:26px;top:18px;background:none;border:0;color:#9ff;font-size:18px;cursor:pointer}

/* mobile (touch) behaviour */
@media (max-width:720px){
  body{font-size:15px} /* уменьшение шрифтов на мобильных (часть 1) */
  .title-image{height:78px}
  .container{margin:12px auto;padding:18px}
  .card{min-width:140px;width:140px}.cover{height:140px}
  .page-bg{animation:none;background:url("images/НЕБО ФОН.jpg")center/cover no-repeat;filter:brightness(.55)contrast(1.02)}
  /* floating window on mobile becomes fullscreen-ish and NOT draggable/resizable */
  .floating-window{width:94vw;left:50%;top:50%;transform:translate(-50%,-50%);min-height:60vh;padding:10px}
  .floating-window .titlebar{cursor:default}
  .resize-handle{display:none}
  .carousel-track{overflow:auto} /* allow finger drag when mobile */
  .fw-cover{width:220px;height:220px} /* чуть меньше на мобиле */
  .fw-title{font-size:20px}
  .fw-tab-content{font-size:16px}
  .album-modal{flex-direction:column;align-items:center;max-height:88vh}
  .album-left{width:90%;flex:0 0 auto}
  .album-right{width:100%}
}
/* ещё меньше на узких телефонах */
@media (max-width:480px){
  body{font-size:14px} /* уменьшение шрифтов на мобильных (часть 2) */
  .meta-title{font-size:15px}
  .meta-sub{font-size:12px}
  .fw-cover{width:180px;height:180px}
  .fw-title{font-size:18px}
  .fw-tab-content{font-size:15px;max-height:44vh}
}

/* === анимация и эффект при открытии "текст будет позже" === */
@keyframes fwAppear {
  0% { transform: translate(-50%, -48%) scale(0.95); opacity: 0.3; filter: brightness(2); }
  60% { transform: translate(-50%, -50%) scale(1.02); opacity: 1; filter: brightness(1.3); }
  100% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
}

.floating-window.showing {
  animation: fwAppear 0.35s cubic-bezier(.3,.9,.4,1.2);
}

/* щелчок при открытии — визуально через фильтр вспышки */
.floating-window.flash {
  animation: fwFlash 0.15s ease-out;
}
@keyframes fwFlash {
  0% { box-shadow: 0 0 25px rgba(0,255,255,0.8); }
  100% { box-shadow: 0 10px 40px rgba(0,0,0,.5); }
}

/* дата под названием трека (не меняем глобально) */
.meta-date {
  font-size: 11px;
  color: #7fb3cc;
  margin-top: 2px;
} 

html {
  zoom: 0.7;
}
html, body {
  overflow: hidden;
}

/* Отключаем анимацию вращения/свечения обложки внутри модалки альбома */
.album-modal .cover:hover,
.album-modal .album-cover:hover,
.album-modal .cover-hover {
  transform: none !important;
  filter: none !important;
  box-shadow: none !important;
  animation: none !important;
}

/* === УНИФИКАЦИЯ ОКНА АЛЬБОМА === */
.album-modal {
  background: #0b0d0e !important; /* как у окна трека */
  border-radius: 4px !important;  /* убрать лишнее округление */
  border: 2px solid rgba(0,160,255,0.14) !important;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5) !important;
  color: #dfefff !important;
  font-size: 16px !important; /* как у треков */
  overflow: visible !important; /* убираем внутреннюю прокрутку */
}

.album-right {
  overflow: visible !important; /* убираем вертикальный scroll внутри правой части */
}

/* фикс чтобы треклист не создавал лишний скролл */
.album-right .tracklist {
  overflow: visible !important;
  max-height: none !important;
}

/* ховер треков оставляем, но без сдвига, чтобы не дёргало контент */
.album-right .tracklist li:hover {
  background: rgba(0,160,255,0.06);
  transform: none !important;
}
/* === КРЕСТИК ВНУТРИ ОКНА АЛЬБОМА === */
.album-modal {
  position: relative !important; /* теперь крестик будет считать координаты от модалки */
}

.album-modal .close {
  position: absolute !important;
  top: 10px !important;
  right: 10px !important;
  background: none;
  border: 0;
  color: #9ff;
  font-size: 18px;
  cursor: pointer;
  z-index: 5;
}
.track-feat {
  color: #888;
  font-size: 0.9em;
  margin-left: 4px;
}

</style>
</head>
<body>
<div class="page-bg" aria-hidden="true"></div>
<div class="overlay-dim" aria-hidden="true"></div>

<div class="topbar">

<div class="container">

  <!-- Tracks -->
  <section class="section" id="tracks-section">

  <section class="section" id="albums-section">

    </div>
    <div class="albums-grid" id="albums-grid">
    <div class="album-card">
  <a href="album_mcuboyniystaffchik.html" class="album-link" aria-label="МЦ УБОЙНЫЙ СТАФФЧИК EP">

      >
    </div>

</div>

    <div class="album-card">

      <img class="album-cover" src="images/covers/elmao2.png" alt="эльмао 2" loading="lazy" decoding="async">

</div>

      <!-- Album card: обложка обёрнута в .cover чтобы использовать ту же анимацию -->
      <div class="album-card">
        <a href="album_elmao.html" class="album-link" aria-label="Альбом эльмао">
          <div class="cover" style="height:240px;">
            <img class="album-cover" src="images/covers/elmao.jpg" alt="эльмао" loading="lazy" decoding="async">

</div>

<!-- Modal for covers / show-all (below top floating) -->
<div class="modal-overlay-all" id="modalAll" aria-hidden="true">
  <div class="modal-all" role="dialog" aria-modal="true" aria-labelledby="modalAllTitle">
    <button class="close" id="modalAllClose">✕</button>
    <h3 id="modalAllTitle" style="color:#bfeaff">Все треки</h3>
    <div class="modal-all-content" id="modalAllContent"></div>
  </div>
</div>


<!-- Floating "Text will be later" window (трековая модалка) -->
<div class="floating-window" id="floatingWindow" role="dialog" aria-modal="true" aria-labelledby="fwTitle">
  <div class="titlebar" id="fwTitlebar">
    <div class="label" id="fwLabel">Текст — Скоро</div>
    <div class="controls"><button id="fwClose" style="background:none;border:0;color:#9ff;cursor:pointer;font-size:18px">✕</button></div>
  </div>
  <div class="content" id="fwContent">
    <p id="fwText">Текст появится позже.</p>
  </div>
  <div class="resize-handle tl"></div>
  <div class="resize-handle tr"></div> 
  <div class="resize-handle bl"></div>

<script type="module">
import { tracksData } from "./js/data/tracks.js";

/* =========== Элементы DOM =========== */
const carouselTrack = document.getElementById('tracks-track');
const modalAll = document.getElementById('modalAll');
const modalAllContent = document.getElementById('modalAllContent');
const modalAllClose = document.getElementById('modalAllClose');

const floating = document.getElementById('floatingWindow');
const fwTitlebar = document.getElementById('fwTitlebar');
const fwContent = document.getElementById('fwContent');
const fwLabel = document.getElementById('fwLabel');
const fwClose = document.getElementById('fwClose');

const albumModalOverlay = document.getElementById('albumModal');
const albumModalClose = document.getElementById('albumModalClose');
const albumModalCover = document.getElementById('albumModalCoverImg');
const albumModalTitle = document.getElementById('albumModalTitle');
const albumModalMeta = document.getElementById('albumModalMeta');
const albumModalDesc = document.getElementById('albumModalDesc');
const albumTracklist = document.getElementById('albumTracklist');
const albumListenBtn = document.getElementById('albumListenBtn');

const showAllBtnEl = document.getElementById('showAllBtn');
const arrowLeft = document.getElementById('arrowLeft') || document.querySelector('.arrow.left');
const arrowRight = document.getElementById('arrowRight') || document.querySelector('.arrow.right');

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

/* =========== Создание карточки трека (как было) =========== */
function makeCard(track, index) {
  const card = document.createElement('div');
  card.className = 'card';

  const a = document.createElement('a');
  a.href = '#';
  a.className = 'track-link';
  a.setAttribute('aria-label', track.title);
  a.dataset.index = String(index);

  const cover = document.createElement('div');
  cover.className = 'cover';

  const img = document.createElement('img');
  img.src = track.cover ? track.cover : 'images/placeholder-track.jpg';
  img.loading = 'lazy';
  img.decoding = 'async';
  img.sizes = '(max-width:720px) 140px, (max-width:1180px) 200px, 220px';
  img.srcset = (track.cover ? track.cover : 'images/placeholder-track.jpg') + ' 1x';
  img.alt = track.title || 'track cover';
  img.onerror = function() {
    this.onerror = null;
    this.src = 'images/placeholder-track.jpg';
    this.srcset = 'images/placeholder-track.jpg 1x';
  };
  cover.appendChild(img);

  const title = document.createElement('div');
  title.className = 'meta-title';
  title.textContent = track.title;

  const sub = document.createElement('div');
  sub.className = 'meta-sub';
  sub.textContent = track.performer ? track.performer : 'zverski napalen :3';

  const date = document.createElement('div');
  date.className = 'meta-date';

  try {
    if (track.date && track.date.includes('.')) {
      const parts = track.date.split('.');
      const yearPart = parts[2] ? parts[2].trim() : '';
      date.textContent = yearPart.length === 2 ? '20' + yearPart : yearPart;
    } else {
      date.textContent = track.date || '';
    }
  } catch (err) {
    console.error('Ошибка обработки даты:', err);
    date.textContent = track.date || '';
  }

  a.appendChild(cover);
  a.appendChild(title);
  a.appendChild(sub);
  a.appendChild(date);
  card.appendChild(a);

  return card;
}

/* =========== Заполнение карусели треков и модального "все треки" =========== */
function fillTracks(){
  carouselTrack.innerHTML = '';
  modalAllContent.innerHTML = '';
  tracksData.forEach((t, i) => {
    const card = makeCard(t, i);
    carouselTrack.appendChild(card);

    // применяем hover/спин
    const coverEl = card.querySelector('.cover');
    setupCoverSpin(coverEl);

    // клон для модалки "все"
    const clone = card.cloneNode(true);
    const cloneLink = clone.querySelector('.track-link');
    if (cloneLink) cloneLink.dataset.index = String(i);
    modalAllContent.appendChild(clone);

    const cloneCover = clone.querySelector('.cover');
    setupCoverSpin(cloneCover);
  });
}
fillTracks();

/* =========== Hover spin: тот же эффект, что и для треков =========== */
function setupCoverSpin(coverEl){
  if (!coverEl) return;
  let spinning = false, timeoutId = null;
  coverEl.addEventListener('mouseenter', () => {
    if (isTouch) return;
    coverEl.classList.add('cover-hover');
    coverEl.style.transition = 'transform 0.14s ease-out';
    coverEl.style.transform = 'rotateX(720deg) rotateY(720deg) rotateZ(360deg) scale(1.04)';
    spinning = true;
    clearTimeout(timeoutId);
    timeoutId = setTimeout(() => {
      coverEl.style.transition = 'transform 1s cubic-bezier(.2,.8,.2,1)';
      coverEl.style.transform = 'rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1)';
      spinning = false;
    }, 160);
  });
  coverEl.addEventListener('mouseleave', () => {
    if (isTouch) return;
    clearTimeout(timeoutId);
    coverEl.style.transition = 'transform .28s ease';
    coverEl.style.transform = 'rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1)';
    coverEl.classList.remove('cover-hover');
    spinning = false;
  });
  coverEl.addEventListener('touchstart', () => {
    coverEl.classList.add('cover-hover');
    setTimeout(()=> coverEl.classList.remove('cover-hover'), 350);
  }, {passive:true});
}

/* =========== Применяем тот же hover-эффект к обложкам альбомов (в DOM уже обёрнуты в .cover) =========== */
document.querySelectorAll('#albums-grid .cover').forEach(el => setupCoverSpin(el));

/* =========== Arrow behavior for tracks carousel =========== */
if (arrowLeft) arrowLeft.addEventListener('click', ()=> carouselTrack.scrollBy({left:-420, behavior:'smooth'}));
if (arrowRight) arrowRight.addEventListener('click', ()=> carouselTrack.scrollBy({left:420, behavior:'smooth'}));

/* =========== Touch / drag handling for carousel (mobile) =========== */
let isPointerDown=false, startX=0, scrollLeftStart=0;
carouselTrack.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && !isTouch) return;
  isPointerDown = true;
  try { carouselTrack.setPointerCapture(e.pointerId); } catch(e){}
  startX = e.clientX;
  scrollLeftStart = carouselTrack.scrollLeft;
});
carouselTrack.addEventListener('pointermove', (e) => {
  if (!isPointerDown) return;
  const dx = e.clientX - startX;
  carouselTrack.scrollLeft = scrollLeftStart - dx;
});
carouselTrack.addEventListener('pointerup', (e) => {
  isPointerDown = false;
  try { carouselTrack.releasePointerCapture(e.pointerId); } catch(e){}
});
carouselTrack.addEventListener('pointercancel', ()=> isPointerDown=false);

/* =========== "Показать все" — модалка =========== */
showAllBtnEl.addEventListener('click', () => {
  modalAll.style.display = 'flex';
  modalAll.setAttribute('aria-hidden','false');
  const ma = modalAll.querySelector('.modal-all');
  if (ma) ma.scrollTop = 0;
});
modalAllClose.addEventListener('click', ()=> {
  modalAll.style.display = 'none';
  modalAll.setAttribute('aria-hidden','true');
});
modalAll.addEventListener('click', (e)=> {
  if (e.target === modalAll) {
    modalAll.style.display = 'none';
    modalAll.setAttribute('aria-hidden','true');
  }
});

/* =========== Делегированные клики для открытия плавающего окна (треков) =========== */
function onTrackClickByIndex(index){
  const idx = Number(index);
  if (Number.isNaN(idx) || !tracksData[idx]) return;
  openFloatingWindow(tracksData[idx]);
}

carouselTrack.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('.track-link');
  if (!a) return;
  e.preventDefault();
  const idx = a.dataset.index;
  onTrackClickByIndex(idx);
});
modalAllContent.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('.track-link');
  if (!a) return;
  e.preventDefault();
  const idx = a.dataset.index;
  onTrackClickByIndex(idx);
});

/* =========== Floating window (действие трека) =========== */
let drag = false, dragOffsetX=0, dragOffsetY=0;
fwClose.addEventListener('click', closeFloatingWindow);

function openFloatingWindow(track){
  fwLabel.style.display = 'none';
  fwContent.innerHTML = '';

  const wrap = document.createElement('div');
const coverSrc = track.cover ? track.cover : 'images/placeholder-track.jpg';

// Выбираем кнопку в зависимости от названия трека
const buttonSrc = track.title && track.title.trim().toUpperCase() === "РАКОВОБОЛЬНОЙ УРОДЛИВЫЙ РЕБЁНОК"
  ? "images/listenbutton2.png"
  : "images/listenbutton.png";

const titleHtml = `<div style="display:flex;gap:12px;align-items:flex-start">
  <div style="flex:0 0 auto">
    <img src="${coverSrc}" alt="${escapeHtml(track.title)}" class="fw-cover" id="fwCoverImg" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='images/placeholder-track.jpg';">
  </div>
  <div style="flex:1">
    <div class="fw-title">${escapeHtml(track.title)}</div>
    <div class="fw-meta">${escapeHtml(track.performer ? track.performer : 'zverski napalen :3')} · ${escapeHtml(track.date || '')}</div>
    <div class="fw-listen">
      <img src="${buttonSrc}" alt="Слушать" id="listenBtn" style="width:180px;cursor:pointer;transition:transform .08s ease">
    </div>
  </div>
</div>`;

  const tabsHtml = `
    <div class="fw-tabs" role="tablist">
      <button id="tabText" class="fw-tab-active">Текст</button>
      <button id="tabHistory" class="fw-tab-inactive">История создания</button>
    </div>
    <div id="tabContent" class="fw-tab-content"></div>
  `;

  wrap.innerHTML = titleHtml + tabsHtml;
  fwContent.appendChild(wrap);

  const listenBtn = document.getElementById('listenBtn');
  if (listenBtn){
    listenBtn.addEventListener('mousedown',()=>listenBtn.style.transform='scale(0.94)');
    listenBtn.addEventListener('mouseup',()=>listenBtn.style.transform='scale(1)');
    listenBtn.addEventListener('mouseleave',()=>listenBtn.style.transform='scale(1)');
    listenBtn.addEventListener('click',()=> {
      try {
        if (track.listenUrl && typeof track.listenUrl === 'string') {
          const w = window.open(track.listenUrl,'_blank','noopener');
          if (!w) { alert('ПРИЯТНОГО ПРОСЛУШИВАНИЯ БРАТИШКА ЁП)'); }
        } else {
          alert('Ссылка для прослушивания отсутствует.');
        }
      } catch(err){
        console.error('Ошибка при открытии ссылки:', err);
        alert('Не удалось открыть ссылку.');
      }
    });
  }

  const tabText = document.getElementById('tabText');
  const tabHist = document.getElementById('tabHistory');
  const tabCont = document.getElementById('tabContent');

  const text = track.text || 'Текст появится позже.';
  const hist = track.history || 'История скоро будет.';

  function showText(){
    tabText.classList.add('fw-tab-active'); tabText.classList.remove('fw-tab-inactive');
    tabHist.classList.add('fw-tab-inactive'); tabHist.classList.remove('fw-tab-active');
    tabCont.textContent = text;
  }
  function showHist(){
    tabHist.classList.add('fw-tab-active'); tabHist.classList.remove('fw-tab-inactive');
    tabText.classList.add('fw-tab-inactive'); tabText.classList.remove('fw-tab-active');
    tabCont.textContent = hist;
  }
  tabText.addEventListener('click', showText);
  tabHist.addEventListener('click', showHist);
  showText();

  const img = document.getElementById('fwCoverImg');
  if (img) img.addEventListener('click',()=> {
    try {
      const w = window.open(coverSrc,'_blank','noopener');
      if (!w) console.warn('Popup blocked while trying to open cover');
    } catch(e){ console.error(e); }
  });

  floating.style.display = 'block';
  floating.classList.add('showing','flash');
  floating.style.zIndex = 13000;
  if (!isTouch){
    floating.style.width = '600px';
    floating.style.left = '50%';
    floating.style.top = '50%';
    floating.style.transform = 'translate(-50%,-50%)';
  } else {
    floating.style.width = '94vw';
    floating.style.height = '70vh';
    floating.style.left = '50%';
    floating.style.top = '50%';
    floating.style.transform = 'translate(-50%,-50%)';
    document.body.style.overflow='hidden';
  }
  setTimeout(()=> floating.classList.remove('flash'),160);
}

function closeFloatingWindow(){
  floating.style.display = 'none';
  fwLabel.style.display = '';
  document.body.style.removeProperty('overflow');
}

/* dragging on desktop (titlebar) */
if (!isTouch){
  fwTitlebar.addEventListener('mousedown', (e)=>{
    if (e.target.closest('button')) return;
    drag = true;
    const rect = floating.getBoundingClientRect();
    dragOffsetX = e.clientX - rect.left;
    dragOffsetY = e.clientY - rect.top;
    document.documentElement.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', (e)=>{
    if (!drag) return;
    let nx = e.clientX - dragOffsetX;
    let ny = e.clientY - dragOffsetY;
    const vw = window.innerWidth, vh = window.innerHeight;
    const rect = floating.getBoundingClientRect();
    nx = Math.max(8, Math.min(nx, vw - rect.width - 8));
    ny = Math.max(8, Math.min(ny, vh - rect.height - 8));
    floating.style.left = nx + 'px';
    floating.style.top = ny + 'px';
    floating.style.transform = 'none';
  });
  document.addEventListener('mouseup', ()=>{
    if (drag){
      drag = false;
      document.documentElement.style.removeProperty('user-select');
    }
  });

  floating.style.resize = 'both';
}

/* Accessibility/ESC handlers */
document.addEventListener('keydown', (e)=>{
  if (e.key === 'Escape'){
    if (floating.style.display === 'block') closeFloatingWindow();
    else if (modalAll.style.display === 'flex') { modalAll.style.display = 'none'; modalAll.setAttribute('aria-hidden','true'); }
    else if (albumModalOverlay.style.display === 'flex') { albumModalOverlay.style.display = 'none'; albumModalOverlay.setAttribute('aria-hidden','true'); }
  }
});





/* =========== Утилиты =========== */
function escapeHtml(str){
  if (!str && str !== 0) return '';
  return String(str).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}
</script>
