<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Все Рецензии - Zverski Napalen</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: 'Roboto', sans-serif;
  color: #fff;
  overflow-x: hidden;
  background: #000;
}

#bg-gif {
  position: fixed;
  inset: 0;
  background: url('/images/НЕБО ФОН.gif') center center / cover no-repeat;
  z-index: -2;
  filter: brightness(0.4) contrast(1.2);
  animation: bgScroll 60s linear infinite;
}

@keyframes bgScroll {
  0% { background-position: 0% 0%; }
  50% { background-position: 100% 100%; }
  100% { background-position: 0% 0%; }
}

h1 {
  text-align: center;
  font-size: 4em;
  color: #00b7ff;
  text-shadow: 0 0 12px #0077ff;
  margin: 20px;
  font-weight: 900;
}

.back-button {
  position: absolute;
  top: 20px;
  left: 20px;
  color: #00b7ff;
  font-size: 1.5em;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}
.back-button:hover { color: #fff; }
.back-button svg { width: 20px; height: 20px; }

.central-block {
  max-width: 900px;
  margin: 20px auto;
  background: rgba(0,0,0,0.35);
  padding: 20px;
  border-radius: 0;
  border: 2px solid #00ccff;
  color: #fff;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.reviews-list {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.review-item {
  background: rgba(0, 0, 0, 0.4);
  padding: 15px;
  border: 2px solid #00ccff;
  border-radius: 5px;
  display: flex;
  gap: 15px;
  position: relative;
  align-items: flex-start;
}

.user-avatar {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
}

.track-cover {
  width: 120px;
  height: 120px;
  background-color: #333;
  flex-shrink: 0;
}
.track-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 0;
}

.review-item .review-content {
  flex: 1;
}
.review-item h3 { color: #00ccff; font-size: 1.2em; margin: 0; }
.review-item p { margin: 5px 0; line-height: 1.5; }
.review-item .rating { font-size: 1.1em; color: #00ccff; }
.review-item .total-score { font-size: 1.5em; color: #00b7ff; font-weight: bold; }

.review-item .edit-delete-buttons {
  position: absolute;
  bottom: 10px;
  right: 10px;
  display: flex;
  gap: 10px;
}
.review-item .edit-delete-buttons button {
  background: none;
  border: none;
  color: #00ccff;
  font-size: 1.5em;
  cursor: pointer;
  transition: color 0.3s;
}
.review-item .edit-delete-buttons button:hover { color: #fff; }

.bottom-gif {
  display: block;
  margin: 40px auto;
  max-width: 100%;
  height: auto;
}
</style>
</head>
<body>

<div id="bg-gif"></div>

<a href="#" class="back-button" onclick="window.history.back();">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path d="M17 18l-6-6 6-6"></path></svg>
  Назад
</a>

<h1>Все Рецензии</h1>

<div class="central-block">
  <div class="reviews-list" id="reviews-list"></div>
</div>

<img src="images/output-onlinegiftools.gif" class="bottom-gif" alt="Turnabout">

<script type="module">
import { supabase } from './supabase-client.js';
import { getCurrentUser } from './accounts.js';

const reviewsList = document.getElementById('reviews-list');
const currentUser = getCurrentUser();

// Рендер одной рецензии
function renderReview(review) {
  const div = document.createElement('div');
  div.className = 'review-item';
  
  div.innerHTML = `
    <img class="user-avatar" src="${review.user_photo || 'images/avatarka01.jpg'}" alt="${review.user_nickname || 'Без ника'}">
    <div class="review-content">
      <h3>${review.track_title} — ${review.performer}</h3>
      <p><strong>Автор:</strong> ${review.user_nickname || 'Без ника'}</p>
      <div class="rating">
        <p>Рифмы/Образы: ${review.rhymes}</p>
        <p>Структура/Ритмика: ${review.structure}</p>
        <p>Реализация стиля: ${review.style}</p>
        <p>Харизма: ${review.charisma}</p>
        <p>Вайб: ${review.vibe}</p>
      </div>
      <div class="total-score">Итоговый балл: ${review.total_score}</div>
      <p>${review.review_text}</p>
    </div>
    <img class="track-cover" src="${review.cover || ''}" alt="${review.track_title}">
  `;

  if (currentUser && (currentUser.nickname === review.user_nickname || currentUser.nickname === 'zverskinapalen')) {
    const btnContainer = document.createElement('div');
    btnContainer.className = 'edit-delete-buttons';

    const editBtn = document.createElement('button');
    editBtn.textContent = '✏️';
    editBtn.onclick = () => editReview(review);
    btnContainer.appendChild(editBtn);

    const delBtn = document.createElement('button');
    delBtn.textContent = '🗑️';
    delBtn.onclick = () => deleteReview(review);
    btnContainer.appendChild(delBtn);

    div.appendChild(btnContainer);
  }

  reviewsList.appendChild(div);
}

// Загружаем все рецензии из Supabase
async function loadReviews() {
  const { data, error } = await supabase
    .from('reviews')
    .select(`*, users(nickname, photo)`)
    .order('created_at', { ascending: false });

  if (error) { console.error(error); return; }

  reviewsList.innerHTML = '';
  data.forEach(r => renderReview({
    ...r,
    user_nickname: r.users?.nickname,
    user_photo: r.users?.photo
  }));
}

// Редактирование рецензии
async function editReview(review) {
  const newText = prompt('Введите новый текст рецензии', review.review_text);
  if (!newText) return;
  const newRhymes = parseInt(prompt('Рифмы / Образы', review.rhymes)) || review.rhymes;
  const newStructure = parseInt(prompt('Структура / Ритмика', review.structure)) || review.structure;
  const newStyle = parseInt(prompt('Реализация стиля', review.style)) || review.style;
  const newCharisma = parseInt(prompt('Харизма', review.charisma)) || review.charisma;
  const newVibe = parseFloat(prompt('Вайб', review.vibe)) || review.vibe;

  const baseScore = newRhymes + newStructure + newStyle + newCharisma;
  const totalScore = baseScore * 1.4 * (1 + (newVibe - 1) * 0.06747);

  const { error } = await supabase
    .from('reviews')
    .update({
      review_text: newText,
      rhymes: newRhymes,
      structure: newStructure,
      style: newStyle,
      charisma: newCharisma,
      vibe: newVibe,
      total_score: totalScore
    })
    .eq('id', review.id);

  if (error) { alert('Ошибка редактирования'); console.error(error); return; }
  loadReviews();
}

// Удаление рецензии
async function deleteReview(review) {
  if (!confirm('Вы уверены?')) return;
  const { error } = await supabase
    .from('reviews')
    .delete()
    .eq('id', review.id);
  if (error) { alert('Ошибка удаления'); console.error(error); return; }
  loadReviews();
}

loadReviews();
</script>

</body>
</html>
