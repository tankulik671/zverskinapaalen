<!DOCTYPE html> 
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>???</title>
<link rel="icon" type="image/gif" href="images/output-onlinegiftools.gif">
<style>
html, body {
  margin:0; padding:0; width:100%; height:100%; background:black; overflow:hidden;
}

/* первая гифка */
.logo {
  position:absolute;
  top:50%; left:50%;
  width:300px;
  transform:translate(-50%, -50%);
  z-index:2;
}

/* круг под клик */
#circle {
  position:absolute;
  top:50%; left:50%;
  width:1px; height:1px;
  background:black;
  border-radius:50%;
  transform:translate(-50%, -50%);
  z-index:3;
  display:none;
}

/* ВТОРАЯ ГИФКА — белая собачка на весь экран */
#dogExit {
  position:absolute;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  object-fit: cover;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  -ms-interpolation-mode: nearest-neighbor;
  display:none;
  z-index:5;
  filter: contrast(1.2) brightness(1.1);
}
</style>
</head>
<body>

<!-- первая гифка, 3-секундный цикл -->
<img src="images/output-onlinegiftools.gif" class="logo" id="logo">

<!-- переходный круг -->
<div id="circle"></div>

<!-- вторая гифка (большая, на весь экран) -->
<img src="images/1128(1).gif" id="dogExit">

<script>
const logo = document.getElementById('logo');
const dogExit = document.getElementById('dogExit');
const circle = document.getElementById('circle');

let exploded = false;
let idleTime = 0;
let idleInterval = null;

/* -------------------------------------
    ЗАПУСК ТАЙМЕРА БЕЗДЕЙСТВИЯ
-------------------------------------- */
function resetIdle() {
    idleTime = 0;
}
document.addEventListener("mousemove", resetIdle);
document.addEventListener("keydown", resetIdle);
document.addEventListener("click", resetIdle);

resetIdle();

/* -------------------------------------
    СЧЁТЧИК: каждые 3 сек = 1 цикл
    один раз через 11 секунд
-------------------------------------- */
idleInterval = setInterval(() => {
    idleTime += 3;

    if (idleTime >= 11) { // 11 секунд бездействия
        clearInterval(idleInterval); // больше проверок не будет
        if (Math.random() < 0.5) { 
            triggerDogExit(); // 50% шанс запуска
        }
        // иначе 50% — ничего не делаем, первая гифка остаётся
    }
}, 3000);

/* -------------------------------------
     ВКЛЮЧИТЬ ВТОРУЮ ГИФКУ
-------------------------------------- */
function triggerDogExit() {
    if (exploded) return;
    exploded = true;

    // скрываем первую гифку
    logo.style.display = "none";

    // показать вторую на весь экран
    dogExit.style.display = "block";

    // отключаем события и таймеры
    document.removeEventListener("mousemove", resetIdle);
    document.removeEventListener("keydown", resetIdle);
    document.removeEventListener("click", resetIdle);
    clearInterval(idleInterval);

    // когда вторая гифка отыграет — остаётся чёрный экран
    setTimeout(() => {
        dogExit.style.display = "none";
    }, 5000); // примерно длина гифки
}

/* -------------------------------------
      КЛИК ПО ЛОГОТИПУ → ПЕРЕХОД
-------------------------------------- */
function playDiveSound(){
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(800,ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60,ctx.currentTime+0.8);
    gain.gain.setValueAtTime(0.2,ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.8,ctx.currentTime+0.2);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+1);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime+1);
}

logo.addEventListener('click', ()=>{
    if (exploded) return;

    playDiveSound();

    circle.style.display = 'block';
    circle.style.width = '1px';
    circle.style.height = '1px';
    const maxDim = Math.sqrt(window.innerWidth**2 + window.innerHeight**2) * 2;

    setTimeout(()=>{
        circle.style.transition = 'width 1s ease-out, height 1s ease-out';
        circle.style.width = maxDim + 'px';
        circle.style.height = maxDim + 'px';
    },10);

    setTimeout(()=>{ window.location.href='main.html'; },1200);
});
</script>

</body>
</html>
