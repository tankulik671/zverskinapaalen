<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="images/хули.jpg">
<title>lol</title>
<style>
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #000;
}

.pattern {
  position: fixed;
  inset: 0;
  background-image: url("images/хули.jpg");
  background-repeat: repeat;
  background-size: 200px 200px; /* можешь поменять масштаб паттерна */
  animation: scrollPattern 40s linear infinite;
  filter: brightness(0.8) contrast(1.2);
}

@keyframes scrollPattern {
  0%   { background-position: 0 0; }
  50%  { background-position: 100% 100%; }
  100% { background-position: 0 0; }
}
</style>
</head>
<body>
  <div class="pattern"></div>
</body>
</html>
