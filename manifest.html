<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>404</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: black;
    overflow: hidden;
  }

  /* === Собака === */
  .dog {
    position: absolute;
    top: 45%; /* поднята выше центра */
    left: 50%;
    width: 420px;
    transform: translate(-50%, -50%);
    transform-origin: center center;
    image-rendering: pixelated;
  }

  /* === Текст 404 === */
  .text404 {
    position: absolute;
    top: 68%; /* поднят ближе к собаке */
    left: 50%;
    width: 180px;
    transform: translateX(-50%);
    image-rendering: pixelated;
  }
</style>
</head>
<body>
  <img src="images/Без названия469_20251106073613.png" class="dog" id="dog" alt="Персонаж">
  <img src="images/Без названия469_20251106073632.png" class="text404" alt="404">

<script>
  const dog = document.getElementById('dog');

  // === Колбасня пса ===
  let startTime = performance.now();
  const duration = 4000; // 4 секунды

  const interval = setInterval(() => {
    const elapsed = performance.now() - startTime;
    const progress = elapsed / duration;

    if (progress >= 1) {
      clearInterval(interval);
      dog.style.transform = 'translate(-50%, -50%) rotate(0deg) scale(1)';
      return;
    }

    const intensity = (1 - progress) ** 2; // плавное затухание
    const multiplier = 3; // мощность
    const dx = (Math.random() - 0.5) * 180 * intensity * multiplier;
    const dy = (Math.random() - 0.5) * 180 * intensity * multiplier;
    const rot = (Math.random() - 0.5) * 180 * intensity * multiplier;
    const scaleX = 1 + (Math.random() - 0.5) * 1.8 * intensity;
    const scaleY = 1 + (Math.random() - 0.5) * 1.8 * intensity;

    dog.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${rot}deg) scale(${scaleX}, ${scaleY})`;
  }, 40);

  // === Звук высокого писка при открытии ===
  window.addEventListener('load', () => {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    function beep(freq, startTime) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(0.25, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.08);
      osc.connect(gain).connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + 0.08);
    }

    const now = ctx.currentTime;
    beep(1600, now);
    beep(1900, now + 0.08);
  });
</script>
</body>
</html>
